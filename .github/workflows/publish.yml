name: "publish"

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      DENO_DIR: deno_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.DENO_DIR }}
          key: ${{ hashFiles('deno.lock') }}

      - name: install frontend dependencies
        run: deno install

      # macOS ties permissions such as Accessibility to the app's signature.
      # Ad-hoc signatures change with every build, so users would have to
      # grant them again after each update; a Developer ID signature stays the
      # same, and notarization lets Gatekeeper open the app without a warning.
      # See docs/MACOS-SIGNING.md.
      - name: set up macOS signing and notarization
        if: matrix.platform == 'macos-latest'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::No MACOS_CERTIFICATE secret: this build is ad-hoc signed, so macOS asks for permissions again after updating."
            exit 0
          fi
          certificate="$RUNNER_TEMP/signing.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$certificate"
          # Sign by the certificate's hash: a self-signed certificate is not
          # "valid" to `find-identity -v`, and codesign accepts a hash either way.
          identities="$(security find-identity -p codesigning "$keychain")"
          identity="$(awk '/"Developer ID Application:/ { print $2; exit }' <<< "$identities")"
          [ -n "$identity" ] || identity="$(awk '/^ *1\)/ { print $2; exit }' <<< "$identities")"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE contains no code-signing identity."
            exit 1
          fi
          echo "Signing with certificate $identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          # Tauri notarizes when all three are set; empty values would fail.
          if [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_PASSWORD" ] && [ -n "$NOTARY_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$NOTARY_APPLE_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID secrets: this build is signed but not notarized."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: deno task tauri
          tagName: tv__VERSION__
          releaseName: "OpenDeck VSD M18 v__VERSION__"
          releaseBody: |
            OpenDeck VSD M18 release builds for Apple silicon Macs and Windows x64.

            VSD Craft feature parity is still in progress. See [TODO.md](https://github.com/nickhighland/OpenDeck-VSD-Inside-M18/blob/main/TODO.md) and [the parity audit](https://github.com/nickhighland/OpenDeck-VSD-Inside-M18/blob/main/docs/VSD-CRAFT-PARITY.md) for verified coverage and remaining work. Boot-logo replacement is intentionally excluded.

            See the README for installation instructions.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
