name: "publish"

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      DENO_DIR: deno_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.DENO_DIR }}
          key: ${{ hashFiles('deno.lock') }}

      - name: install frontend dependencies
        run: deno install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: deno task tauri
          tagName: tv__VERSION__
          releaseName: "OpenDeck VSD M18 v__VERSION__"
          releaseBody: |
            OpenDeck VSD M18 release builds for Apple silicon Macs and Windows x64.

            VSD Craft feature parity is still in progress. See [TODO.md](https://github.com/nickhighland/OpenDeck-VSD-Inside-M18/blob/main/TODO.md) and [the parity audit](https://github.com/nickhighland/OpenDeck-VSD-Inside-M18/blob/main/docs/VSD-CRAFT-PARITY.md) for verified coverage and remaining work. Boot-logo replacement is intentionally excluded.

            See the README for installation instructions.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
